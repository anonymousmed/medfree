<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — MEDFREE</title>
    <style>
      :root { --ink: #e7ecf5; --ink2: #9aa9c2; --accent: #4f9cf9; --surface: #12161f; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0c12; color: var(--ink); display: grid; place-items: center; min-height: 100vh; }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      .mark { font-size: 3rem; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: var(--ink2); line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 0.75rem; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">🩺</div>
      <h1>You're offline</h1>
      <p>MEDFREE needs a connection to load fresh study material, the Human Atlas and questions. Reconnect and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
