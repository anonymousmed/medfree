name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx pytest pytest-asyncio asgi-lifespan ruff
      - run: ruff check app tests || true
      - run: python -m pytest ../../tests -q

  web:
    name: Web (build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm --workspace @medfree/web run build
